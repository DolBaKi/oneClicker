<!--
  collect.html
  - 성능 측정 화면 (2단계)
  - 브라우저가 직접 잴 수 있는 성능만 실측하고, 그 뒤에 체감 평가를 받는다
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>성능 측정</title>

  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />

  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/measure.css" />
</head>
<body>
  <div class="screen">
    <div class="card card--wide">
      <!-- 진행 표시: 지금은 2단계 -->
      <ul class="steps">
        <li class="step">1</li>
        <li class="step is-active">2</li>
        <li class="step">3</li>
      </ul>

      <h1>성능 측정</h1>

      <!-- 이전 화면에서 넘어온 기기 정보 요약. 내용은 collect.js가 채운다 -->
      <p id="device-summary"></p>

      <p class="notice">
        약 10초간 노트북 성능을 측정합니다.<br />
        정확한 측정을 위해 다른 프로그램을 닫고 진행해 주세요.
      </p>

      <!-- 측정 실패 시에만 보인다 -->
      <p class="measure-error hidden" id="measure-error"></p>

      <button class="btn" id="start-measure" type="button">성능 측정 시작</button>

      <!-- 항목별 진행 상태. 목록은 collect.js가 그린다 -->
      <ul class="steplist" id="steplist"></ul>

      <div class="actions">
        <button class="btn btn-ghost" id="back-button" type="button">이전</button>
        <!-- 서버 저장에 실패했을 때만 나타난다. 평소에는 측정이 끝나면 저절로 넘어간다 -->
        <button class="btn hidden" id="result-button" type="button">결과 보기</button>
      </div>
    </div>
  </div>

  <script type="module" src="../js/collect.js"></script>
</body>
</html>
