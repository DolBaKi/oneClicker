<!--
  collect.html
  - 데이터 수집 화면 (2단계)
  - 이전 화면의 기기 정보를 요약해서 보여주고, 실제 입력칸은 4차시에 채운다
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>데이터 수집</title>

  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />

  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body>
  <div class="screen">
    <div class="card card--wide">
      <!-- 진행 표시: 지금은 2단계 -->
      <ul class="steps">
        <li class="step">1</li>
        <li class="step is-active">2</li>
        <li class="step">3</li>
      </ul>

      <h1>데이터 수집</h1>

      <!-- 이전 화면에서 넘어온 기기 정보 요약. 내용은 collect.js가 채운다 -->
      <p id="device-summary"></p>

      <!-- 좌우 2단: 제목만 두고 입력칸은 다음 차시에 -->
      <div class="two-col">
        <section>
          <h2 class="field-label">시스템 수치</h2>
          <!-- TODO: 4차시 - 배터리 사이클, 저장장치 사용량 등 입력칸 추가 -->
        </section>
        <section>
          <h2 class="field-label">체감 평가</h2>
          <!-- TODO: 4차시 - 발열, 소음, 속도 체감 입력칸 추가 -->
        </section>
      </div>
    </div>
  </div>

  <script type="module" src="../js/collect.js"></script>
</body>
</html>
