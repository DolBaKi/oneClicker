<!--
  result.html
  - 분석 결과 화면 (3단계)
  - 측정 결과를 점수·그래프로 보여주고, 다른 기기 기록과 비교한다
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>분석 결과</title>

  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />

  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/measure.css" />
  <link rel="stylesheet" href="../css/result.css" />
</head>
<body>
  <div class="screen">
    <div class="card card--wide">
      <!-- 진행 표시: 마지막 3단계 -->
      <ul class="steps">
        <li class="step">1</li>
        <li class="step">2</li>
        <li class="step is-active">3</li>
      </ul>

      <h1>측정 결과</h1>
      <p id="device-summary"></p>
      <p class="usage-period" id="usage-period"></p>

      <!-- 중단했을 때만 보인다 -->
      <p class="measure-error hidden" id="interrupted-note">
        측정이 중단되어 아래 값들의 정확도가 낮습니다. 다시 측정하면 더 정확해집니다.
      </p>

      <!-- 지속 부하 그래프 -->
      <h2 class="field-label">부하를 주는 동안의 성능 변화</h2>
      <div id="stress-chart"></div>
      <p class="stress-note" id="stress-note"></p>
      <p class="chart-help" id="throttle-detail"></p>
      <p class="chart-help">
        그래픽에 15초간 계속 부하를 걸면서 잰 처리량입니다.
        선이 평평하면 성능이 끝까지 유지된 것이고, 아래로 꺾이면 그 시점부터 느려진 것입니다.
      </p>

      <!-- 측정 지표. 내용은 result-metrics.js가 채운다 -->
      <div id="metric-list"></div>

      <p class="notice">
        점수나 등급은 매기지 않았습니다. "몇 ms가 몇 점인가"를 정하려면 여러 기기의
        실제 측정 분포가 있어야 하는데 아직 그 기록이 없기 때문입니다.
        지금은 잰 값을 그대로 보여드립니다.
      </p>

      <!-- 캡처 실패 시에만 보인다 -->
      <p class="measure-error hidden" id="capture-error"></p>

      <div class="actions">
        <button class="btn btn-ghost" id="restart-button" type="button">처음부터 다시</button>
        <button class="btn" id="capture-button" type="button">캡처하기</button>
      </div>
    </div>
  </div>

  <script type="module" src="../js/result.js"></script>
</body>
</html>
