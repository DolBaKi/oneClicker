<!--
  index.html
  - 서비스 첫 화면(랜딩 페이지)
  - 서비스 소개와 [진단 시작하기] 버튼만 있고, 클릭하면 device.html로 이동한다
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>노트북 노후 상태 분석 서비스</title>

  <!-- Pretendard 폰트를 CDN에서 불러옴 (실패해도 tokens.css의 폴백 글꼴이 대신 쓰임) -->
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />

  <!-- CSS는 변수(tokens) → 리셋(base) → 배치(layout) 순서로 불러온다 -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
</head>
<body>
  <div class="screen">
    <div class="card">
      <h1>노트북 노후 상태 분석 및 교체 시기 예측 서비스</h1>
      <p>시스템 데이터를 읽어 부품별 노후 점수를 매기고, 언제 바꿔야 하는지 개월 수로 알려줍니다</p>
      <button id="start-button">진단 시작하기</button>
    </div>
  </div>

  <!-- ES Module로 분리된 스크립트 -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
